name: CustomOS build and tests

on:
  push:
    branches:
      - main
      - feature/visual-novel-editor
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86
      - name: Build CustomOS
        run: |
          make clean
          make
      - name: Test ProjectFS formatter and diagnostic application build
        run: make test
      - name: Verify ProjectFS persistence across QEMU restart
        run: python3 tools/test_projectfs_qemu.py --kernel bin/customos.elf --app build/apps/app_fs_test.cbx
      - name: Run packaged novel inside CustomOS
        run: make test-novel-player
