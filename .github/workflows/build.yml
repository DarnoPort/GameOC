name: CustomOS build and tests

on:
  push:
    branches:
      - main
      - feature/visual-novel-editor
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
      - name: Build CustomOS
        run: |
          make clean
          make
      - name: Test persistent disk image formatter
        run: make test
